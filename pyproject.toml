[project]
name = "language-tutor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.148.0",
  "uvicorn==0.54.0",
  "pydantic-ai-slim[openai,mcp]==2.57.0",
  "mcp==1.30.0",
  "openai==3.35.1",
  "httpx==0.28.1",
  "httpx2==2.14.0",
  "PyJWT[crypto]==2.15.1",
  "fastmcp-slim[client]==3.4.9",
  "spacy==3.8.11",
  "en-core-web-sm",
  "youtube-transcript-api==1.2.4",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
